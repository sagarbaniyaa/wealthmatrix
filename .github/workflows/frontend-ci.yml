name: Frontend CI

# Mirrors backend-ci.yml's reasoning: before this workflow existed,
# nothing ran the frontend's tests (or even type-checked it, or proved
# it still builds) on push — same "safety net only runs if someone
# remembers to run it by hand" gap the backend pipeline closed.
on:
  push:
    branches: [main]
    paths: ['frontend/**']
  pull_request:
    paths: ['frontend/**']

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Production build (BACKEND_API_URL is unused at build time — only read at request time)
        env:
          BACKEND_API_URL: http://localhost:3000
        run: npm run build

      # CRITICAL, not high: two known HIGH advisories live inside Next's
      # OWN internally-vendored postcss copy (next/node_modules/postcss,
      # used by Next's build pipeline, not the app's own top-level
      # postcss) with no fix short of a Next v16 major upgrade — see
      # frontend/README.md's Known gaps. audit-level=high would make
      # this gate permanently red for a documented, deliberately-
      # deferred issue, which trains everyone to ignore it. critical
      # still catches anything genuinely new and urgent.
      - name: Audit for new CRITICAL runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
